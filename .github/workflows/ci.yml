name: E-commerce CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check backend/server.js

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: CI=false npm run build

  docker-publish:
    name: Build and push Docker images to ECR
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::311937350493:role/github-actions-ecommerce-deploy
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile -t "$REGISTRY/ecommerce-backend:$IMAGE_TAG" .
          docker push "$REGISTRY/ecommerce-backend:$IMAGE_TAG"
          docker tag "$REGISTRY/ecommerce-backend:$IMAGE_TAG" "$REGISTRY/ecommerce-backend:latest"
          docker push "$REGISTRY/ecommerce-backend:latest"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f frontend/Dockerfile -t "$REGISTRY/ecommerce-frontend:$IMAGE_TAG" ./frontend
          docker push "$REGISTRY/ecommerce-frontend:$IMAGE_TAG"
          docker tag "$REGISTRY/ecommerce-frontend:$IMAGE_TAG" "$REGISTRY/ecommerce-frontend:latest"
          docker push "$REGISTRY/ecommerce-frontend:latest"
