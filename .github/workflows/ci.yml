name: E-commerce CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check backend/server.js

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: CI=false npm run build

  docker-publish:
    name: Build and push Docker images to ECR
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::311937350493:role/github-actions-ecommerce-deploy
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f backend/Dockerfile -t "$REGISTRY/ecommerce-backend:$IMAGE_TAG" .
          docker push "$REGISTRY/ecommerce-backend:$IMAGE_TAG"
          docker tag "$REGISTRY/ecommerce-backend:$IMAGE_TAG" "$REGISTRY/ecommerce-backend:latest"
          docker push "$REGISTRY/ecommerce-backend:latest"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f frontend/Dockerfile -t "$REGISTRY/ecommerce-frontend:$IMAGE_TAG" ./frontend
          docker push "$REGISTRY/ecommerce-frontend:$IMAGE_TAG"
          docker tag "$REGISTRY/ecommerce-frontend:$IMAGE_TAG" "$REGISTRY/ecommerce-frontend:latest"
          docker push "$REGISTRY/ecommerce-frontend:latest"

      - name: Deploy to EC2 through SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: i-04706b3137e89814b
        run: |
          set -euo pipefail
          SCRIPT_B64="$(base64 -w 0 scripts/deploy-ec2.sh)"
          PARAMS="$(jq -cn --arg script "$SCRIPT_B64" --arg tag "$IMAGE_TAG" \
            '{commands: ["printf %s " + $script + " | base64 -d > /tmp/ecommerce-deploy.sh", "sudo install -o root -g root -m 700 /tmp/ecommerce-deploy.sh /usr/local/bin/ecommerce-deploy.sh", "sudo /usr/local/bin/ecommerce-deploy.sh " + $tag]}')"

          COMMAND_ID="$(aws ssm send-command \
            --region us-east-2 \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --comment "E-commerce deployment $IMAGE_TAG" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command ID: $COMMAND_ID"
          STATUS="Pending"

          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --region us-east-2 \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"

            echo "Deployment status: ${STATUS:-Pending} ($attempt/60)"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region us-east-2 \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --region us-east-2 \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment."
          aws ssm get-command-invocation \
            --region us-east-2 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json || true
          exit 1

      - name: Deploy to EC2 through SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: i-04706b3137e89814b
        run: |
          set -euo pipefail
          SCRIPT_B64="$(base64 -w 0 scripts/deploy-ec2.sh)"
          PARAMS="$(jq -cn --arg script "$SCRIPT_B64" --arg tag "$IMAGE_TAG" \
            '{commands: ["printf %s " + $script + " | base64 -d > /tmp/ecommerce-deploy.sh", "sudo install -o root -g root -m 700 /tmp/ecommerce-deploy.sh /usr/local/bin/ecommerce-deploy.sh", "sudo /usr/local/bin/ecommerce-deploy.sh " + $tag]}')"

          COMMAND_ID="$(aws ssm send-command \
            --region us-east-2 \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMS" \
            --comment "E-commerce deployment $IMAGE_TAG" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command ID: $COMMAND_ID"
          STATUS="Pending"

          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --region us-east-2 \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"

            echo "Deployment status: ${STATUS:-Pending} ($attempt/60)"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region us-east-2 \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --region us-east-2 \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment."
          aws ssm get-command-invocation \
            --region us-east-2 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json || true
          exit 1
